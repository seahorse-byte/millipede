[project]
name = "millipede-llm-worker"
version = "0.1.0"
description = "Stage 3 Kafka enrichment worker for Team Radar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
otel = [
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.scripts]
millipede-llm-worker = "millipede_llm_worker.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["millipede_llm_worker*"]
