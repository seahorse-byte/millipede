[package]
name = "millipede-gateway"
version = "0.1.0"
edition = "2021"
default-run = "millipede-gateway"

[lib]
name = "millipede_gateway"
path = "src/lib.rs"

[[bin]]
name = "millipede-gateway"
path = "src/main.rs"

[[bin]]
name = "mint-dev-jwt"
path = "src/bin/mint_dev_jwt.rs"

[dependencies]
axum.workspace = true
axum-server.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
millipede-tls-common.workspace = true
tower = "0.5"
http = "1"
bytes = "1"
futures-util.workspace = true
tower-http = { workspace = true, features = ["cors"] }
